kind = "web"
previewPath = "/"
title = "火車搖晃紀錄系統"
version = "1.0.0"
id = "artifacts/train-shake"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22563

[services.development]
run = "pnpm --filter @workspace/train-shake run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/train-shake", "run", "build" ]
serve = "static"
publicDir = "artifacts/train-shake/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22563"
BASE_PATH = "/"
